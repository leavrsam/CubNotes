<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

        <defs>
          <linearGradient id="h-wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F0FF"/>
            <stop offset="100%" stop-color="#0052FF"/>
          </linearGradient>
          <linearGradient id="h-diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0052FF"/>
            <stop offset="100%" stop-color="#4F46E5"/>
          </linearGradient>
          <linearGradient id="h-branch-top" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0052FF"/>
            <stop offset="100%" stop-color="#10B981"/>
          </linearGradient>
          <linearGradient id="h-branch-bot" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#F59E0B"/>
          </linearGradient>
          <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0052FF" flood-opacity="0.25"/>
          </filter>
        </defs>
        
    
    
    <g transform="translate(0, 0)" filter="url(#h-shadow)">
      <!-- Acoustic Soundwave Arcs (Speech Recording) -->
      <path d="M 112 178 A 90 90 0 0 1 112 334" fill="none" stroke="#00F0FF" stroke-width="18" stroke-linecap="round" opacity="0.45"/>
      <path d="M 148 202 A 62 62 0 0 1 148 310" fill="none" stroke="#00D4FF" stroke-width="20" stroke-linecap="round" opacity="0.8"/>
      <path d="M 184 226 A 34 34 0 0 1 184 286" fill="none" stroke="#0085FF" stroke-width="22" stroke-linecap="round"/>

      <!-- Audio Inflow Stem -->
      <line x1="196" y1="256" x2="224" y2="256" stroke="#0052FF" stroke-width="22" stroke-linecap="round"/>

      <!-- Central AI Decision Diamond (Gemini 3.8 Synthesis) -->
      <polygon points="256,212 300,256 256,300 212,256" fill="url(#h-diamond-grad)"/>
      <circle cx="256" cy="256" r="11" fill="#FFFFFF"/>
      <circle cx="256" cy="256" r="5" fill="#0052FF"/>

      <!-- Flowchart Top Branch (Milestone Node) -->
      <path d="M 300 256 L 334 256 A 20 20 0 0 0 354 236 L 354 186 A 20 20 0 0 1 374 166 L 398 166" 
            fill="none" stroke="url(#h-branch-top)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="400" cy="166" r="22" fill="#10B981"/>
      <circle cx="400" cy="166" r="9" fill="#FFFFFF"/>

      <!-- Flowchart Bottom Branch (Action Node Card) -->
      <path d="M 300 256 L 334 256 A 20 20 0 0 1 354 276 L 354 326 A 20 20 0 0 0 374 346 L 398 346" 
            fill="none" stroke="url(#h-branch-bot)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="378" y="324" width="44" height="44" rx="14" fill="#F59E0B"/>
      <circle cx="400" cy="346" r="8" fill="#FFFFFF"/>
    </g>
    
</svg>